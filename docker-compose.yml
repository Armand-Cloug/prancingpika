services:
  web:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: ptpika_web
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      parser:
        condition: service_healthy
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Upload logs -> shared volume
      - COMBATLOG_DIR=/data/combat.log
      # Call parser & bot service inside docker network
      - PARSER_URL=http://parser:8080
      - BOT_URL=http://bot:8081
    volumes:
      # tes uploads publics (images/etc)
      - uploads:/app/public/upload
      # logs de combat partagés avec le parser
      - combatlogs:/data/combat.log
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      internal:

  parser:
    build:
      context: ./rust
      dockerfile: Dockerfile
    container_name: ptpika_parser
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Construit l'URL DB à partir des variables du .env racine
      # (utilise le hostname docker "db" au lieu de localhost)
      - DATABASE_URL=mysql://${MARIADB_USER}:${DB_PASSWORD}@db:3306/${MARIADB_DATABASE}
    expose:
      - "8080"
    volumes:
      - combatlogs:/data/combat.log
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      internal:

  db:
    image: mariadb:11.4
    container_name: ptppika_mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p\"$${MARIADB_ROOT_PASSWORD}\" --silent || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      internal:

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: ptpika_bot
    restart: unless-stopped
    env_file:
      - ./bot/.env
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      internal:

volumes:
  dbdata:
  uploads:
  combatlogs:

networks:
  internal:
    external: true
    name: internal
