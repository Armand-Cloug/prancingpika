services:
  web:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: ptpika_web
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      parser:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_proxy
      - traefik.http.services.ptpika.loadbalancer.server.port=3000
      # Apex (canonique)
      - traefik.http.routers.ptpika.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.ptpika.entrypoints=websecure
      - traefik.http.routers.ptpika.tls=true
      - traefik.http.routers.ptpika.tls.certresolver=letsencrypt
      # www -> apex (301)
      - traefik.http.routers.ptpika-www.rule=Host(`www.${APP_DOMAIN}`)
      - traefik.http.routers.ptpika-www.entrypoints=websecure
      - traefik.http.routers.ptpika-www.tls=true
      - traefik.http.routers.ptpika-www.tls.certresolver=letsencrypt
      - traefik.http.routers.ptpika-www.middlewares=ptpika-redirect-apex
      - traefik.http.middlewares.ptpika-redirect-apex.redirectregex.regex=^https?://www\.${APP_DOMAIN}(.*)
      - traefik.http.middlewares.ptpika-redirect-apex.redirectregex.replacement=https://${APP_DOMAIN}$$1
      - traefik.http.middlewares.ptpika-redirect-apex.redirectregex.permanent=true
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - COMBATLOG_DIR=/data/combat.log
      - PARSER_URL=http://parser:8080
      - BOT_URL=http://bot:8081
    volumes:
      - uploads:/app/public/upload
      - combatlogs:/data/combat.log
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - traefik_proxy
      - internal

  parser:
    build:
      context: ./rust
      dockerfile: Dockerfile
    container_name: ptpika_parser
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Construit l'URL DB à partir des variables du .env racine
      # (utilise le hostname docker "db" au lieu de localhost)
      - DATABASE_URL=mysql://${MARIADB_USER}:${DB_PASSWORD}@db:3306/${MARIADB_DATABASE}
    expose:
      - "8080"
    volumes:
      - combatlogs:/data/combat.log
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      internal:

  db:
    image: mariadb:11.4
    container_name: ptppika_mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p\"$${MARIADB_ROOT_PASSWORD}\" --silent || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      internal:

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: ptpika_bot
    restart: unless-stopped
    env_file:
      - ./bot/.env
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      internal:

volumes:
  dbdata:
  uploads:
  combatlogs:

networks:
  traefik_proxy:
    external: true
    name: traefik_proxy
  internal:
    driver: bridge
    name: ptpika_internal
