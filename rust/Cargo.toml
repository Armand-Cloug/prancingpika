[package]
name        = "pika-parser"
version     = "0.1.0"
edition     = "2021"
description = "Rift combat-log parser — CLI + DB importer"

[[bin]]
name = "pika-parser"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio       = { version = "1",    features = ["full"] }

# MySQL async driver (no compile-time query checking needed)
sqlx        = { version = "0.7",  features = [
    "mysql",
    "runtime-tokio-native-tls",
    "chrono",
    "bigdecimal",
] }

# CLI argument parsing
clap        = { version = "4",    features = ["derive"] }

# .env file loading
dotenvy     = "0.15"

# Error handling
anyhow      = "1"

# Regex (fight extractor fallback)
regex       = "1"

# Lazy statics (BOSS_DEFS, CLASS_MAP, ROLE_MAP)
once_cell   = "1"

# SHA-1 for roster hash
sha1        = "0.10"

# Date/time
chrono      = { version = "0.4",  features = ["serde"] }

# Hex encoding (sha1 output)
hex         = "0.4"

# HTTP server
axum        = "0.7"
tower-http  = { version = "0.5", features = ["cors"] }

# JSON serialization
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
